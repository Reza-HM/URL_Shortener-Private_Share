name: Relay checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: relay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay-ci-only
          POSTGRES_DB: relay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relay -d relay_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RELAY_TEST_DATABASE_URL: postgresql://relay:relay-ci-only@127.0.0.1:5432/relay_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  container:
    runs-on: ubuntu-24.04
    env:
      POSTGRES_PASSWORD: relay-ci-container-only
      RATE_LIMIT_SECRET: relay-ci-container-secret-not-for-production
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - name: Start PostgreSQL
        run: docker compose up -d --wait --wait-timeout 120 db
      - name: Apply migrations
        run: docker compose run --rm --no-deps migrate
      - name: Start application and cleanup
        run: docker compose up -d --no-deps --wait --wait-timeout 120 app cleanup
      - name: Health and lifecycle smoke
        run: node scripts/container-smoke.mjs
      - name: Startup diagnostics
        if: failure()
        run: node scripts/ci-diagnostics.mjs
      - if: always()
        run: docker compose logs --no-color --tail 60
      - if: always()
        run: docker compose down --volumes
